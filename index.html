<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Напарник по привычке</title><meta name="color-scheme" content="light dark">
<style>
:root{--ind:#4338ca;--ind2:#7a6df0;--card:#fff;--lav:var(--lav);--ln:#eee;--bg2:#e8e8ee;--lime:#d6ee5e;--peach:#f6cfc2;--bg:#f4f4f6;--ink:#14142b;--mut:#7b7b8f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.35 -apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg2);color:var(--ink)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);padding:18px 18px 110px;position:relative;overflow-x:hidden}
h1{font-size:30px;letter-spacing:-.5px;line-height:1.1;margin:10px 0 6px}h2{font-size:17px}
.s{color:var(--mut);font-size:14px}.sm{font-size:12px;color:var(--mut)}.up{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:16px 4px 6px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
input{font:inherit;width:100%;border:0;background:var(--card);border-radius:16px;padding:14px;margin:4px 0 10px;color:var(--ink);outline:2px solid transparent}input:focus{outline-color:#4338ca55}
label{font-size:12px;color:var(--mut);margin-left:4px}
.btn{display:block;width:100%;padding:16px;border-radius:30px;color:#fff;font-weight:600;text-align:center;background:linear-gradient(135deg,var(--ind2),var(--ind));box-shadow:0 6px 16px #4338ca40;margin-top:18px}
.btn.g{background:none;color:var(--ind);box-shadow:none;padding:12px;margin-top:4px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;display:block;width:100%;text-align:left}
.peach{background:linear-gradient(135deg,#f8d8cc,#efbfb2)}.lav{background:var(--lav)}.limec{background:#f1f9c9}
.hero{background:linear-gradient(135deg,#e4f56e,#c7e84a);border-radius:26px;padding:20px;margin:12px 0}
.big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.bar{height:6px;background:var(--card);border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#14142b;border-radius:6px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.top .pb{flex:1;height:5px;background:#dcdcec;border-radius:5px}.top .pb i{display:block;height:100%;background:var(--ind);border-radius:5px}.top span{font-size:12px;color:var(--mut)}
.bk{width:38px;height:38px;border-radius:50%;background:var(--card);font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chip{padding:11px 16px;border-radius:24px;background:var(--card);border:1px solid var(--ln);font-size:15px}.chip.on{background:var(--ind);color:#fff;border-color:var(--ind)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dir{background:var(--card);border-radius:18px;padding:14px;text-align:left;font-size:15px;display:flex;gap:8px;align-items:center;border:2px solid transparent}.dir.on{border-color:var(--ind);background:var(--lav)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fde3dc;font-size:19px;flex:none}.ic.l{background:var(--lime)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row input{width:130px;margin:0;padding:8px;text-align:right}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;background:var(--lime)}.av.p{background:#4338ca;color:#fff}
.sw{width:50px;height:30px;border-radius:20px;background:#d9d9e3;position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ind)}.sw.on::after{left:23px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(398px,calc(100% - 28px));background:var(--card);border-radius:30px;box-shadow:0 8px 28px #0002;display:flex;padding:6px;z-index:5}
.nav button{flex:1;padding:8px 0;border-radius:24px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}.nav button b{font-size:20px;font-weight:400}.nav button.on{background:var(--lav);color:var(--ind)}
.wk{display:grid;grid-template-columns:44px repeat(7,1fr);gap:5px;align-items:center;text-align:center;font-size:12px;color:var(--mut);margin-top:6px}
.d{width:26px;height:26px;border-radius:50%;margin:auto;background:var(--ln);display:grid;place-items:center;font-size:13px;color:#14142b}.d.y{background:var(--lime)}.d.t{background:var(--card);border:2px solid var(--ind)}
.msg{max-width:80%;padding:11px 14px;border-radius:18px;margin:6px 0;font-size:15px;background:#f8d8cc}.msg.me{background:var(--ind);color:#fff;margin-left:auto}
.bars{display:flex;gap:10px;align-items:flex-end;height:110px;margin-top:10px}.bars div{flex:1;text-align:center;font-size:11px}.bars u{display:block;border-radius:8px;background:#ec9c88;text-decoration:none;margin-bottom:4px}
.mg{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}.mg i{aspect-ratio:1;border-radius:6px;border:1.5px solid #dcdce6}.mg i.y{background:var(--lime);border-color:var(--lime)}.mg i.m{background:var(--ln);border-color:var(--ln)}.mg i.t{border-color:var(--ink)}
.seg{display:flex;gap:8px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#14142b;color:#fff;padding:12px 18px;border-radius:20px;z-index:9;font-size:14px;max-width:90%}
.hardbg{background:#fde8e1;margin:-18px -18px -110px;padding:18px;min-height:100vh}.err{color:#d6452f;font-size:13px;margin:4px 4px}
.splash{margin:-18px -18px -110px;min-height:100vh;background:linear-gradient(150deg,#7f74e3,#4338ca 55%,#3b30b8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{display:flex}.logo i{width:62px;height:62px;border-radius:50%;background:var(--lime)}.logo i+i{background:var(--peach);margin-left:-20px}
html[data-a=mint]{--ind:#0f8a6a;--ind2:#34c79b}html[data-a=rose]{--ind:#c2386b;--ind2:#ee7aa3}
html[data-t=dark]{--bg:#12121c;--bg2:#0b0b12;--card:#1d1d2b;--ink:#f1f1f7;--mut:#9a9ab0;--lav:#2b2b4d;--ln:#2c2c3c;color-scheme:dark}
html[data-t=dark] .hardbg{background:#2a1c20}
.hero,.peach,.limec,.msg:not(.me),.av:not(.p){color:#14142b}.peach .s{color:#5d5360}.hero .bar{background:#fff}
.ck{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ind);display:grid;place-items:center;font-size:22px;flex:none;color:#fff}.ck.y{background:var(--ind)}
.lock{filter:blur(4px);pointer-events:none;user-select:none}.pro{background:linear-gradient(135deg,#ffe9a8,#f6c75a);color:#4a3500;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.ad{border:1px dashed var(--mut)}.d[onclick],.mg i[onclick]{cursor:pointer}.nav button{font-size:10px}.nav button b{font-size:19px}
</style></head><body><div id="app"></div><script>
var K='napar_live_v1',P=[['Зарядка','Делать зарядку 15 минут',3,'🏃'],['Режим сна','Ложиться до 23:30',7,'🌙'],['Здоровое питание','Есть овощи на обед',5,'🥗'],['Отказ от вредной привычки','Сократить на 1–2 раза в день',7,'🚭'],['Саморазвитие','Учиться или читать 20 минут',4,'📚'],['Меньше соцсетей','Не больше 1 часа в соцсетях',7,'📱'],['','',3,'✏️']];
var DN=['Спорт и активность','Сон и режим дня','Питание и ЗОЖ','Отказ от вредных привычек','Саморазвитие и обучение','Меньше соцсетей','Другая привычка'];
var U=[{id:0,n:'Лёша',a:20,dir:3,g:'Бросает вейп',tk:2,m:'Настроен',f:1},{id:1,n:'Мария',a:22,dir:0,g:'Зарядка 3 раза в неделю',tk:0,m:'Пробую',f:2},{id:2,n:'Дима',a:24,dir:1,g:'Ложится до 23:30',tk:2,m:'Очень серьёзно',f:0},{id:3,n:'Аня',a:19,dir:2,g:'Ест больше овощей',tk:1,m:'Настроена',f:1},{id:4,n:'Саша',a:23,dir:4,g:'Читает по 20 минут',tk:0,m:'Настроен',f:2},{id:5,n:'Катя',a:21,dir:5,g:'Меньше соцсетей',tk:1,m:'Пробую',f:1},{id:6,n:'Игорь',a:26,dir:0,g:'Бегает 3 раза в неделю',tk:0,m:'Очень серьёзно',f:0},{id:7,n:'Оля',a:21,dir:3,g:'Сокращает курение',tk:0,m:'Настроена',f:1}];
var TK=['Утром','Днём','Вечером'],TT=['08:00','14:00','20:00'],FM=['Только отметки','Пару раз в неделю','Каждый день'];
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var SUP=['Тяга обычно проходит за несколько минут. Ты уже сделал много — один трудный день ничего не отменяет.','Ты не обязан быть идеальным. Достаточно маленького шага сегодня.','Трудный день — часть пути. Твой прогресс остаётся с тобой.','Сделай глубокий вдох. Ты справлялся раньше — справишься и сейчас.'];
var REP=['Держись, я рядом!','Круто, горжусь тобой 💪','Спасибо, что написал(а)!','Сегодня тоже отметился. Вместе проще 🙂','Ты молодец!'];
let S,T,tm=180;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{screen:'splash',done:{},post:{},red:{},msgs:[],notif:true,ntime:'21:00',q:{tk:2,fm:1},sup:0};
var save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
var pad=n=>String(n).padStart(2,'0'),dk=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var dt=k=>new Date(k+'T00:00:00'),fd=k=>{const d=dt(k);return WD[(d.getDay()+6)%7]+', '+d.getDate()+' '+MON[d.getMonth()]};
var nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
var esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var N=()=>S.habit?Math.round((dt(dk(0))-dt(S.habit.start))/864e5)+1:1,wd=()=>(new Date().getDay()+6)%7;
var streak=()=>{let n=0,o=S.done[dk(0)]?0:-1;while(S.done[dk(o)]){n++;o--}return n},total=()=>Object.keys(S.done).length;
var wkKeys=()=>[...Array(7)].map((_,i)=>dk(i-wd()));
var ini=()=>esc(((S.user&&S.user.name)||'А')[0].toUpperCase());
var pr=()=>U[S.partner],fq=f=>f==7?'каждый день':f+' раза в неделю';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function go(s){clearInterval(T);if(REC)vstop(0);S.screen=s;save();render();scrollTo(0,0)}
var hd=(b,n)=>`<div class=top><button class=bk onclick="go('${b}')">‹</button><div class=pb><i style="width:${n*20}%"></i></div><span>${n}/5</span></div>`;
var chips=(arr,cur,fn)=>`<div class=chips>${arr.map((x,i)=>`<button class="chip ${cur===i?'on':''}" onclick="${fn}(${i})">${x}</button>`).join('')}</div>`;
var nav=a=>`<div class=nav>${[['today','🏠','Главная'],['partner','👥','Напарник'],['chat','💬','Чат'],['stats','📊','Статистика'],['profile','👤','Профиль']].map(x=>`<button class="${a==x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div>`;
var weekRow=(lab,fn,tgl)=>`<span style="text-align:left">${lab}</span>`+wkKeys().map((k,i)=>{const o=i-wd(),y=fn(k,o);return `<div class="d ${y?'y':o==0?'t':''}" ${tgl&&o<=0?`onclick="tg('${k}')"`:''}>${y?'✓':''}</div>`}).join('');
var pd=o=>o>0?false:o==0?true:(o+pr().id*3+9)%5!=0;
var V={};
V.splash=()=>{setTimeout(()=>{if(S.screen=='splash')go(S.auth&&S.habit?'today':'welcome')},1300);return `<div class=splash onclick="go('welcome')"><div class=logo><i></i><i></i></div><h1 style="margin-top:24px">Напарник</h1><p style="opacity:.7;font-size:14px">Менять привычки проще вдвоём</p></div>`};
V.welcome=()=>`<button class=bk style="float:right" onclick="S.th=document.documentElement.dataset.t=='dark'?'light':'dark';save();render()">◐</button><div class=logo style="transform:scale(.55);transform-origin:left;height:40px"><i></i><i></i></div><div style="min-height:72vh;display:flex;flex-direction:column;justify-content:flex-end"><div class=chips style="margin-bottom:12px">${['🏃 Спорт','🌙 Сон','🥗 Питание','🚭 Без вредного','📚 Развитие','📱 Меньше соцсетей'].map(x=>`<span class=chip>${x}</span>`).join('')}</div><h1 style="font-size:38px">Маленькие шаги — большие привычки</h1><p class=s style="margin-top:8px">Ставь небольшие цели, отмечай прогресс и, если захочешь, найди напарника. Без давления и рейтингов.</p><button class=btn style="margin-top:28px" onclick="go('reg')">Создать аккаунт</button><button class="btn g" onclick="go('login')">У меня уже есть аккаунт</button></div>`;
V.reg=()=>`${hd('welcome',1)}<h1>Давай знакомиться</h1><p class=s>Фото не нужно — напарник увидит только твой ник и цель.</p><div style="margin-top:12px"><label>Имя или ник</label><input id=rn value="${esc(S.user?.name)}"><label>Возраст (необязательно)</label><input id=ra type=number value="${esc(S.user?.age)}" placeholder="Можно пропустить"><label>Почта</label><input id=re type=email placeholder="name@mail.ru"><label>Пароль</label><input id=rp type=password placeholder="Минимум 6 символов"></div><label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input id=r18 type=checkbox style="width:auto;margin:0"> Мне есть 18 лет</label><div class=err id=er></div><button class=btn onclick="reg()">Дальше</button><p class=sm style="text-align:center;margin-top:8px">Нажимая «Дальше», ты соглашаешься с условиями сервиса и обработкой персональных данных (почта, имя, цель)</p>`;
V.login=()=>`<div class=top><button class=bk onclick="go('welcome')">‹</button></div><h1>С возвращением</h1><p class=s>Войди в свой аккаунт</p><div style="margin-top:14px"><label>Почта</label><input id=le type=email><label>Пароль</label><input id=lp type=password></div><div class=err id=er></div><button class=btn onclick="login()">Войти</button>`;
V.habit=()=>{const g=S.g||{};return `${hd(S.habit?'profile':'reg',2)}<h1>Что хочешь изменить?</h1><p class=s>Выбери направление — с него и начнём.</p><div class=grid style="margin-top:14px">${DN.map((n,i)=>`<button class="dir ${g.dir===i?'on':''}" onclick="pick(${i})"><span class="ic ${i&&i<3||i==4?'l':''}">${P[i][3]}</span>${n}</button>`).join('')}</div>${g.dir===6?`<label style="margin-top:12px;display:block">Твоя привычка</label><input id=cn value="${esc(g.name)}" oninput="S.g.name=this.value" placeholder="Например: пить воду">`:''}<div class=err id=er></div><button class=btn onclick="habitNext()">Дальше</button>`};
V.goal=()=>{const g=S.g;return `${hd(S.editing?'profile':'habit',3)}<h1>Поставим цель</h1><p class=s>Лучше маленькая и реальная: не «заниматься спортом», а «зарядка 15 минут 3 раза в неделю».</p>
<div class=card><label>Название привычки</label><input value="${esc(g.name)}" oninput="S.g.name=this.value"><label>Конкретная цель</label><input value="${esc(g.goal)}" oninput="S.g.goal=this.value" placeholder="Что именно делаешь?"><label>Как часто</label>${chips(['2 раза','3 раза','5 раз','Каждый день'],[2,3,5,7].indexOf(g.freq),'sF')}<label>Удобное время</label>${chips(TK,TT.indexOf(g.time),'sT')}<label>Срок, дней</label>${chips(['14','30','60'],[14,30,60].indexOf(g.days),'sD')}</div>
<div class="card limec"><b>Твой план на ${g.days} дней</b><p class=s style="color:#4a5a14;margin-top:4px">${esc(g.goal||'—')} · ${fq(g.freq)} · в ${g.time}</p></div><div class=err id=er></div><button class=btn onclick="goalNext()">${S.editing?'Сохранить':'Дальше'}</button>`};
V.mode=()=>{const m=S.m||'partner',c=(k,t,d,i)=>`<button class="card ${m==k?'on':''}" style="border:2px solid ${m==k?'var(--ind)':'transparent'};${k=='partner'?'background:linear-gradient(135deg,#f8d8cc,#efbfb2)':''}" onclick="S.m='${k}';render()"><div style="display:flex;gap:12px"><span class=ic style="background:var(--card)">${i}</span><div><b style="font-size:18px">${t}</b><p class=s style="color:#5d5360">${d}</p></div></div></button>`;return `${hd('goal',4)}<h1>Как будешь идти к цели?</h1><p class=s>Режим можно поменять в любой момент.</p><div style="margin-top:12px">${c('partner','С напарником','Подберём человека с той же целью и удобным временем. Это добровольно.','👥')}${c('solo','Сам','План, отметки, статистика и напоминания — без общения.','🎯')}</div><button class=btn onclick="modeNext()">Дальше</button>`};
V.quiz=()=>{const q=S.q;return `${hd('mode',5)}<h1>Подберём напарника</h1><p class=s>Ответь на несколько вопросов — так вам будет удобнее вместе.</p><div class=card style="margin-top:12px"><label>Твой возраст</label><input type=number value="${esc(S.user.age)}" oninput="S.user.age=this.value" placeholder="Например, 20"><label>Цель и периодичность</label><p style="margin:4px 4px 12px"><b>${esc(S.habit.name)}</b> · ${fq(S.habit.freq)}</p><label>Когда удобно отмечаться?</label>${chips(TK,q.tk,'qT')}<label>Формат общения</label>${chips(FM,q.fm,'qF')}</div><div class="card lav" style="font-size:14px">🛡 Общение — только по желанию. Никаких рейтингов и сравнений.</div><button class=btn onclick="S.mi=0;go('match')">Найти напарника</button>`};
var rank=()=>U.map(u=>({...u,sc:(u.dir==S.habit.dir&&S.habit.dir<6?5:0)+(u.tk==S.q.tk?3:0)+(u.f==S.q.fm?1:0)+(Math.abs(u.a-(+S.user.age||20))<=3?1:0)})).sort((a,b)=>b.sc-a.sc||a.id-b.id);
V.match=()=>{const l=rank(),u=l[S.mi%l.length];return `<h1>Нашли напарника!</h1><p class=s>Совпадение: ${Math.min(99,50+u.sc*5)}% · похожая цель и время.</p><div class="card peach" style="padding:22px;margin-top:14px"><div style="display:flex"><div class=av style="width:60px;height:60px">${ini()}</div><div class="av p" style="width:60px;height:60px;margin-left:-14px">${u.n[0]}</div></div><h2 style="font-size:22px;margin-top:12px">${u.n}, ${u.a}</h2><p class=s>${u.g} · держится ${u.id%4+3} дн.</p><hr style="border:0;border-top:1px solid #0001;margin:12px 0">${[['Удобно',TK[u.tk]],['Настрой',u.m],['Общение',FM[u.f]]].map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span class=s>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><p class=sm style="padding:0 6px">${u.n} увидит только твой ник, цель и отметки. Сменить напарника можно в любой момент.</p><button class=btn onclick="accept(${u.id})">Принять напарника</button><button class="btn g" onclick="S.mi++;render()">Показать другого</button><button class="btn g" style="color:var(--mut);font-size:14px" onclick="S.mode='solo';S.partner=null;go('today')">Продолжить самостоятельно</button>`};

}
